<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANISH — private review</title>
<style>*{box-sizing:border-box}body{font:14px/1.6 -apple-system,BlinkMacSystemFont,system-ui;background:#0b0908;color:#e7dac2;max-width:850px;padding:44px 18px;margin:auto}h1{font:normal 28px Georgia,serif;letter-spacing:.12em}.sub{color:#948873}input{background:#1b1712;color:#fff;border:1px solid #665034;padding:12px;width:300px;max-width:100%}button{border:1px solid #886a44;color:#e7d6ba;background:#292013;padding:9px 14px;cursor:pointer}button:hover{background:#453119}.mark{padding:19px 0;border-top:1px solid #4b3a24;display:flex;justify-content:space-between;align-items:center;gap:15px}.mark p{margin:4px 0;font:italic 22px Georgia,serif}.mark small{color:#98866e}.actions{display:flex;gap:8px}.hint{font-size:12px;color:#91806b}a{color:inherit}</style>
<h1>VANISH / REVIEW</h1><p class="sub">Private moderation. The administrator token is held in this tab's memory and is never stored in a cookie.</p>
<form id="login"><input id="key" type="password" placeholder="Administrator token" autocomplete="off" required><button>Load pending</button></form>
<p id="msg" class="hint" role="status"></p><div id="items"></div>
<script>
let token='';const $=s=>document.querySelector(s);async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});if(!r.ok)throw new Error((await r.json()).error||String(r.status));return r.json();}async function load(){try{const d=await api('/api/admin/pending');$('#items').replaceChildren();$('#msg').textContent=d.marks.length+' pending inscription(s)';d.marks.forEach(m=>{const item=document.createElement('div');item.className='mark';const body=document.createElement('div');const t=document.createElement('p');t.textContent=m.body;const small=document.createElement('small');small.textContent='Order #'+m.order_id+' • inscription #'+m.id;body.append(t,small);if(Array.isArray(m.strokes)&&m.strokes.length){
 const c=document.createElement('canvas');c.width=480;c.height=180;c.style.cssText='display:block;width:min(440px,100%);height:150px;background:#16110c;border:1px solid #493e28;margin-top:8px';
 const ctx=c.getContext('2d');ctx.strokeStyle='#d7b48a';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
 for(const path of m.strokes){ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x/1000*c.width,y/1000*c.height):ctx.moveTo(x/1000*c.width,y/1000*c.height));ctx.stroke();}
 body.append(c);
 }const buttons=document.createElement('div');buttons.className='actions';for(const status of ['visible','rejected']){const b=document.createElement('button');b.textContent=status==='visible'?'Approve':'Reject';b.addEventListener('click',async()=>{b.disabled=true;try{await api('/api/admin/moderate','POST',{id:m.id,status});await load();}catch(e){$('#msg').textContent=e.message;b.disabled=false;}});buttons.append(b)}item.append(body,buttons);$('#items').append(item);});}catch(e){$('#msg').textContent=e.message;}}
$('#login').addEventListener('submit',e=>{e.preventDefault();token=$('#key').value;$('#key').value='';load()});
</script></html>
