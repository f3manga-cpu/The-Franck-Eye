name: Revenue harness independent audit
on:
  schedule:
    - cron: '25 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: revenue-harness-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit invariants
        run: python -m unittest discover -s engine/harness/tests -v
      - name: Audit persisted revenue evidence
        run: python engine/harness/audit.py
      - name: Persist sanitized audit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/harness/STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit commercial stage claims and recorded cash"
            git push
          fi
