name: Opportunity research
on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s engine/tests -v
      - run: python engine/performance.py discover
      - name: Commit only research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/data/opportunities.json engine/data/RESEARCH.md
          if ! git diff --cached --quiet; then
            git commit -m "Update opportunity research queue"
            git push
          fi
